plugins {
    id 'com.android.application'
}

android {
    namespace 'com.local.taobaocoinassistant'
    compileSdk 36

    defaultConfig {
        // 测试版 applicationId 与原版（com.local.taobaocoinassistant）区分，以便两者并存安装；
        // Java namespace 保持不变，源码包名仍为 com.local.taobaocoinassistant。
        applicationId 'com.layerverse.taobaocoinassistant'
        minSdk 30
        targetSdk 36
        versionCode 110
        versionName '1.2-d11-fix3'
    }


    splits {
        abi {
            enable true
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86', 'x86_64'
            universalApk false
        }
    }

    // 按 CPU 架构分别生成 APK
    splits {
        abi {
            // 开启 ABI 拆分
            enable true

            // 清空默认 ABI 列表
            reset()

            // 生成这 4 种架构的 APK
            include 'arm64-v8a',
                    'armeabi-v7a',
                    'x86',
                    'x86_64'

            // 不再额外生成包含全部架构的 50MB 万能包
            universalApk false
        }
    }

    buildTypes {
        release {
            // 暂时不动 R8，避免影响现在已经稳定的功能
            minifyEnabled false

            proguardFiles getDefaultProguardFile(
                    'proguard-android-optimize.txt'
            ), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    // AGP 8 默认不生成 BuildConfig；ShizukuShell 需要 BuildConfig.APPLICATION_ID。
    buildFeatures {
        buildConfig true
    }
}

dependencies {
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'

    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
}
