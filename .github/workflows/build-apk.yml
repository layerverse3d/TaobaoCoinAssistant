name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "feature/double11-energy" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub runner 已预装 Android SDK 与 sdkmanager；不需要再跑过时的
      # android-actions/setup-android（其内部 sdkmanager tools 会失败）。
      - name: Install Android 16 SDK
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          yes | sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build debug APKs
        run: gradle :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TaobaoCoinAssistant-debug-apks
          path: app/build/outputs/apk/debug/*.apk
